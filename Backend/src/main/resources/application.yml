server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: adaptive-rag
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:adaptive_rag}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: rag-hikari
      connection-init-sql: "SET app.current_user_id = ''"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      lettuce:
        pool:
          max-active: 20
          min-idle: 5

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 200
        keep-alive: 60s
      thread-name-prefix: rag-async-

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 900000
  refresh-expiration-ms: 604800000

# ── Groq Configuration (FREE) ──────────────────────────────────────────────────
# OPENAI_API_KEY env var holds your GROQ API key (from console.groq.com)
# No OpenAI account or payment needed.
openai:
  api-key: ${OPENAI_API_KEY}
  base-url: https://api.groq.com/openai/v1

  # Final answer generation — llama-3.3-70b is Groq's best free model
  # Quality is comparable to GPT-4o for most RAG tasks
  chat-model: llama-3.3-70b-versatile

  # Grading, rewriting, HyDE — fast 8B model, more than sufficient for these tasks
  # 14,400 req/day free limit — very generous for these short calls
  mini-model: llama-3.1-8b-instant

  # Embedding model — handled by Ollama (see ollama section below)
  # nomic-embed-large produces 1536 dims — SAME as OpenAI text-embedding-3-small
  # NO schema change needed — vector(1536) in V2 migration still valid
  embedding-model: nomic-embed-text
  embedding-dimensions: 1536

  max-tokens: 1500
  temperature: 0.3
  timeout-seconds: 45  # Groq is fast — 45s is generous

# ── Ollama Configuration (FREE, local embeddings) ──────────────────────────────
# Ollama runs on your local machine — completely free, no rate limits.
# Run before starting the app:
#   ollama pull nomic-embed-large
#   ollama serve
#
# BUG FIX: base-url now reads OLLAMA_HOST env variable (set in .env file).
# Previously it was hardcoded to localhost:11434 which NEVER works inside Docker.
# Docker containers cannot reach the host machine via "localhost" — they need
# host.docker.internal (macOS/Windows) or the docker bridge IP (Linux).
# The .env already sets OLLAMA_HOST correctly for each OS — we just needed to
# use it here. Local dev without Docker still works via the default fallback.
ollama:
  base-url: ${OLLAMA_HOST:http://localhost:11434}/v1
  timeout-seconds: 120  # First call after model load can be slow on CPU

# ── RAG Pipeline ────────────────────────────────────────────────────────────────
rag:
  chunk-size: 800
  chunk-overlap: 150
  max-retrieval-results: 6
  similarity-threshold: 0.65  # Slightly lower than 0.70 — Ollama embeddings have
    # different score distribution than OpenAI embeddings.
  # Tune this based on your retrieval quality.
  max-context-tokens: 4000
  ef-search: 100
  hyde-enabled: true
  cross-encoder-enabled: false
  parallel-embed-pool-size: 3  # Lower than OpenAI because Ollama is local/slower
  simple-query-max-words: 5
  # Spend cap set to 0 — both providers are free.
  # Keep enforce-spend-cap: false to avoid spurious rejections.
  enforce-spend-cap: false
  daily-spend-cap-usd: 0.0

storage:
  provider: s3
  s3:
    bucket: ${S3_BUCKET:adaptive-rag-files}
    region: ${AWS_REGION:us-east-1}
    endpoint-override: ${S3_ENDPOINT_OVERRIDE:}

rate-limit:
  ask:
    capacity: 20
    refill-tokens: 20
    refill-seconds: 60
  ingest:
    capacity: 5
    refill-tokens: 5
    refill-seconds: 60

# ── Resilience4j — two circuit breakers: one for Groq, one for Ollama ──────────
resilience4j:
  circuitbreaker:
    instances:
      openai:
        # This is the Groq circuit breaker (kept named "openai" to avoid renaming all annotations)
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      ollama:
        # Separate circuit breaker for Ollama embeddings
        register-health-indicator: true
        sliding-window-size: 5
        failure-rate-threshold: 60        # More lenient — Ollama can be slow to start
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

  retry:
    instances:
      openai:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException.TooManyRequests
          - org.springframework.web.reactive.function.client.WebClientResponseException.ServiceUnavailable
          - java.io.IOException
      ollama:
        max-attempts: 2
        wait-duration: 3s
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientException

  timelimiter:
    instances:
      openai:
        timeout-duration: 45s
      ollama:
        timeout-duration: 120s  # Ollama can be slow on first load

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.ai.rag: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}/%X{spanId}] %-5level %logger{36} - %msg%n"